# postgresql-pafil-windows.conf -- ajustes do Pafil DW sobre o postgresql.conf
# padrao, na instancia Windows.
#
# Instalado como drop-in em data\conf.d\ por provisionar_postgres.ps1. NUNCA
# editar o postgresql.conf principal: mante-lo intocado deixa este arquivo ser
# o unico diff entre o padrao do instalador e a nossa config.
#
# Specs REAIS desta maquina, confirmadas em 20/ago/2026 via Get-CimInstance /
# Get-PhysicalDisk (RUNBOOK_WINDOWS.md, passo 1) -- bem diferentes do
# pedido original a TI (2 vCPU / 4 GB) para uma EC2 que nao chegou a existir:
#   CPU:   Intel Core i5-2400, 4 nucleos / 4 threads (sem hyperthreading)
#   RAM:   ~15,9 GB
#   Disco: dois SSDs (SanDisk SSD PLUS 480GB = C:, WD Green 2.5 480GB = D:).
#          O D: ("DADOS") esta com so ~200MB livres de 480GB -- NAO usar como
#          data directory do Postgres. O Postgres fica no C:, que tem ~105GB
#          livres, de sobra para o volume de dado deste projeto.
# Se esta maquina for trocada no futuro, reconfira estes numeros antes de
# reaplicar o arquivo (shared_buffers ~25% da RAM, effective_cache_size ~75%).

# --- Rede ----------------------------------------------------------------
# localhost only: o acesso do analista e por tunel (RUNBOOK_WINDOWS.md, secao
# 8), que termina na propria maquina. So trocar para o IP da maquina quando o
# gateway do Power BI precisar de rede -- e ai liberando so o IP dele no
# Firewall do Windows (RUNBOOK_WINDOWS.md, secao 7), nunca um range aberto. A
# porta do banco nunca sai da rede interna da empresa.
listen_addresses = 'localhost'
port = 5432
max_connections = 50

# --- Memoria ---------------------------------------------------------------
shared_buffers = 4GB                    # ~25% dos ~15,9 GB reais
effective_cache_size = 12GB             # ~75% dos ~15,9 GB reais (estimativa p/ o planner)
maintenance_work_mem = 512MB            # acelera CREATE INDEX / VACUUM da carga full
work_mem = 32MB                         # por operacao de sort/hash; poucas sessoes (max_connections=50)

# --- Disco (SSD confirmado, ver nota no topo do arquivo) --------------------
random_page_cost = 1.1                  # padrao 4.0 assume disco mecanico; nao e o caso aqui
effective_io_concurrency = 200

# --- WAL / checkpoint --------------------------------------------------------
# A carga full escreve ~777 mil linhas de uma vez; max_wal_size folgado evita
# checkpoints em rajada no meio da ingestao.
wal_compression = on
max_wal_size = 2GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9

# --- Logs --------------------------------------------------------------------
# Log de queries lentas e de DDL: barato e e o que salva no primeiro incidente.
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%a.log'      # rotacao semanal por dia da semana
log_truncate_on_rotation = on
log_rotation_age = 1d
log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = 2000       # ms
log_checkpoints = on
log_connections = on
log_disconnections = on
log_autovacuum_min_duration = 0
log_statement = 'ddl'

# --- Localizacao -------------------------------------------------------------
# timestamptz guarda o instante absoluto; isto afeta apenas a exibicao/now().
timezone = 'America/Sao_Paulo'
log_timezone = 'America/Sao_Paulo'
datestyle = 'iso, dmy'

# --- Autovacuum --------------------------------------------------------------
# A bronze faz TRUNCATE/INSERT em massa; autovacuum um pouco mais agressivo
# evita bloat acumulado entre cargas.
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
