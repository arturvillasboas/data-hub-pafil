# postgresql-pafil.conf — ajustes do Pafil DW sobre o postgresql.conf padrão.
#
# Instalado como drop-in em conf.d/ (Ubuntu/PGDG) ou incluído via include_dir
# (Amazon Linux). NUNCA editar o postgresql.conf principal: mantê-lo intocado
# deixa este arquivo ser o único diff entre o padrão da distro e a nossa config.
#
# Dimensionado para 2 vCPU / 4 GB RAM / EBS gp3. Se a instância mudar de tamanho,
# recalcular shared_buffers (~25% da RAM) e effective_cache_size (~75% da RAM).

# --- Rede --------------------------------------------------------------------
# localhost only: o acesso do analista é por túnel (SSM/SSH), que termina na
# própria máquina. Só trocar para o IP privado da instância quando o host do
# gateway do Power BI existir — e aí liberando no Security Group por SG de
# origem, nunca 0.0.0.0/0. A porta do banco não vai para a internet.
listen_addresses = 'localhost'
port = 5432
max_connections = 50

# --- Memória -----------------------------------------------------------------
shared_buffers = 1GB                    # ~25% da RAM
effective_cache_size = 3GB              # ~75% da RAM (estimativa p/ o planner)
maintenance_work_mem = 256MB            # acelera CREATE INDEX / VACUUM da carga full
work_mem = 16MB                         # por operação de sort/hash; poucas sessões

# --- Disco (EBS gp3 = SSD) ---------------------------------------------------
random_page_cost = 1.1                  # padrão 4.0 assume disco mecânico
effective_io_concurrency = 200

# --- WAL / checkpoint --------------------------------------------------------
# A carga full escreve ~777 mil linhas de uma vez; max_wal_size folgado evita
# checkpoints em rajada no meio da ingestão.
wal_compression = on
max_wal_size = 2GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9

# --- Logs --------------------------------------------------------------------
# Log de queries lentas e de DDL: barato e é o que salva no primeiro incidente.
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%a.log'      # rotação semanal por dia da semana
log_truncate_on_rotation = on
log_rotation_age = 1d
log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = 2000       # ms
log_checkpoints = on
log_connections = on
log_disconnections = on
log_autovacuum_min_duration = 0
log_statement = 'ddl'

# --- Localização -------------------------------------------------------------
# timestamptz guarda o instante absoluto; isto afeta apenas a exibição/now().
timezone = 'America/Sao_Paulo'
log_timezone = 'America/Sao_Paulo'
datestyle = 'iso, dmy'

# --- Autovacuum --------------------------------------------------------------
# A bronze faz TRUNCATE/INSERT em massa; autovacuum um pouco mais agressivo
# evita bloat acumulado entre cargas.
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
