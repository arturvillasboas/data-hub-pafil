version: "3.8"

# Stack da automação de reporting (WhatsApp + email), 100% self-hosted, sem
# nenhuma assinatura nova. Roda dentro do WSL2 via Docker Engine (nao Docker
# Desktop, que tem termos de licenca comercial para empresas). O Postgres de
# producao do Pafil fica de fora desta stack por decisao explicita: o n8n
# alcanca ele pela rede (host.docker.internal), sem containeriza-lo.

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: pafil-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
    volumes:
      - n8n_data:/home/node/.n8n
    extra_hosts:
      # Permite o container alcancar servicos rodando direto no Windows
      # (o Postgres de producao, na porta 5432) sem Docker Desktop.
      - "host.docker.internal:host-gateway"
    depends_on:
      - capture-service
      - evolution-api

  capture-service:
    build: ./capture_service
    container_name: pafil-capture
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - CAPTURE_API_KEY=${CAPTURE_API_KEY}
    volumes:
      # Gerado uma vez por login_once.py (rodado localmente, fora do Docker).
      # Ver README.md desta pasta.
      - ./capture_service/storage_state.json:/app/storage_state.json:ro

  evolution-db:
    image: postgres:16-alpine
    container_name: pafil-evolution-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=${EVOLUTION_DB_PASSWORD}
      - POSTGRES_DB=evolution
    volumes:
      - evolution_db_data:/var/lib/postgresql/data
    # Banco isolado so para o estado interno do Evolution API (sessoes,
    # instancias). NAO e o Postgres de producao do Pafil -- essa separacao
    # e proposital, ver comentario no topo do arquivo.

  evolution-api:
    # Nome/tag confirmado em 26/ago/2026 na doc oficial (doc.evolution-api.com)
    # e no docker-compose.yaml do repo oficial (github.com/evolution-foundation/
    # evolution-api). O projeto muda rapido -- confira de novo se isto voltar a
    # falhar com "pull access denied".
    image: evoapicloud/evolution-api:latest
    container_name: pafil-evolution
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:${EVOLUTION_DB_PASSWORD}@evolution-db:5432/evolution
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - evolution-db

  evolution-manager:
    # Interface web oficial so para o pareamento inicial via QR code -- a API
    # de QR (/instance/connect) e reportada como instavel em algumas versoes.
    # Nao faz parte do fluxo automatizado depois de parear, so uso pontual.
    image: evoapicloud/evolution-manager:latest
    container_name: pafil-evolution-manager
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - evolution-api

volumes:
  n8n_data:
  evolution_db_data:
  evolution_instances:
